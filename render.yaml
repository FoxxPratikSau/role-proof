services:
  - type: web
    name: roleproof-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    domains:
      - roleproof.pratiksav.xyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ROLEPROOF_API_URL
        fromService:
          type: pserv
          name: roleproof-api
          property: hostport

  - type: pserv
    name: roleproof-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: API_ADDRESS
        value: ":10000"
      - key: ALLOWED_ORIGIN
        value: https://roleproof.pratiksav.xyz
      - key: DATABASE_MAX_CONNS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: roleproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: roleproof-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: roleproof
    user: roleproof
    ipAllowList: []
