version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - errname
    - govet
    - gosec
    - loggercheck
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - thelper
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
    - goimports
