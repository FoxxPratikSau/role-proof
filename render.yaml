services:
  - type: web
    name: roleproof-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    # NODE_ENV=production makes npm omit devDependencies by default, but the
    # Next.js build and the prepare hook need the toolchain declared there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    domains:
      - roleproof.pratiksau.xyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ROLEPROOF_API_URL
        fromService:
          type: pserv
          name: roleproof-api
          property: hostport

  - type: pserv
    name: roleproof-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: API_ADDRESS
        value: ":8080"
      - key: ALLOWED_ORIGIN
        value: https://roleproof.pratiksau.xyz
      - key: DATABASE_MAX_CONNS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: roleproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: roleproof-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: roleproof
    user: roleproof
    ipAllowList: []
